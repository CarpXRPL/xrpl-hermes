[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xrpl-hermes"
version = "1.4.0"
description = "Open-source XRPL ecosystem toolkit — 63 knowledge files + 67 working tools + MCP server covering L1, EVM Sidechain, Xahau Hooks, Flare price context, Axelar Bridge, Arweave, and live amendment checks"
authors = [{name = "CarpXRPL"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xrpl-py>=2.5.0,<3.0.0",
    "httpx>=0.27.0",
    "web3>=6.0.0",
    "eth-account>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["scripts*"]

[project.scripts]
xrpl-hermes = "scripts.xrpl_tools:main"
xrpl-hermes-mcp = "scripts.mcp_server:main"
