[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xrpl-hermes"
version = "1.9.1"
description = "Model-agnostic XRPL reads, unsigned transaction builders, and curated workflows with a non-custodial MCP boundary"
authors = [{name = "CarpXRPL"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "xrpl-py>=4.2.0,<6.0.0",
    "httpx>=0.27.0",
    "web3>=6.0.0",
    "eth-account>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.setuptools.data-files]
"share/xrpl-hermes" = ["SKILL.md", "README.md", "QUICKSTART.md", "LIMITATIONS.md", "SECURITY.md", "CHANGELOG.md", "LICENSE"]
"share/xrpl-hermes/knowledge" = ["knowledge/*.md"]
"share/xrpl-hermes/references" = ["references/*.md"]
"share/xrpl-hermes/skills" = ["skills/*.md"]
"share/xrpl-hermes/docs" = ["docs/*.md"]
"share/xrpl-hermes/examples" = ["examples/*.py", "examples/*.md"]
"share/xrpl-hermes/examples/js" = ["examples/js/*.md", "examples/js/*.js"]

[project.scripts]
xrpl-hermes = "scripts.xrpl_tools:main"
xrpl-hermes-mcp = "scripts.mcp_server:main"
